[package]
name = "agent-collab"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Local append-only collaboration board for coding agents (Rust build)"
build = "build.rs"

[lib]
name = "collab"
path = "src/lib.rs"

[[bin]]
name = "collab"
path = "src/bin/collab.rs"

[[bin]]
name = "collab-viewer"
path = "src/bin/collab-viewer.rs"

[[bin]]
name = "collab-install"
path = "src/bin/collab-install.rs"

[dependencies]
indexmap = "2"
sha2 = { version = "0.10", features = ["asm"] }
blake3 = "1"
libc = "0.2"
mimalloc = { version = "0.1.52", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[build-dependencies]
sha2 = "0.10"

[profile.profiling]
inherits = "release"
debug = true
